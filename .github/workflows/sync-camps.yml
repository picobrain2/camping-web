name: Weekly camp sync

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행에서 추가할 최대 개수"
        default: "40"
      region:
        description: "우선 권역 (경기, 강원, all …)"
        default: "경기"
      mode:
        description: "weekly(인기 신규), all(한도까지), full(고캠핑 전체 신규 1회), photos, homepages"
        default: "weekly"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check GoCamping key
        env:
          GOCAMPING_KEY: ${{ secrets.GOCAMPING_KEY }}
        run: |
          if [ -z "$GOCAMPING_KEY" ]; then
            echo "저장소 Secrets에 GOCAMPING_KEY를 넣어 주세요. 공공데이터포털 고캠핑 일반 인증키입니다."
            exit 1
          fi

      - name: Check Firebase upload auth
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && [ -z "$FIREBASE_TOKEN" ]; then
            echo "Firestore 자동 반영용 Secret이 없습니다. FIREBASE_SERVICE_ACCOUNT(권장) 또는 FIREBASE_TOKEN을 넣어 주세요."
            exit 1
          fi

      - run: npm ci

      - name: Sync from GoCamping
        env:
          GOCAMPING_KEY: ${{ secrets.GOCAMPING_KEY }}
          SYNC_LIMIT: ${{ github.event.inputs.limit || '40' }}
          SYNC_REGION: ${{ github.event.inputs.region || '경기' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'weekly' }}"
          if [ "$MODE" = "all" ]; then
            npm run sync:all
          elif [ "$MODE" = "full" ]; then
            SYNC_LIMIT="${{ github.event.inputs.limit || '99999' }}" SYNC_REGION="${{ github.event.inputs.region || 'all' }}" npm run sync:full
          elif [ "$MODE" = "photos" ]; then
            npm run sync:photos
          elif [ "$MODE" = "homepages" ]; then
            npm run enrich:homepages
          else
            npm run sync
          fi

      - name: Upload catalog to Firestore
        env:
          FIREBASE_PROJECT: camping-cf64d
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npm run catalog:upload

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "${{ github.event.inputs.mode == 'photos' && 'data: backfill GoCamping photos' || github.event.inputs.mode == 'homepages' && 'data: enrich camp homepages' || 'data: update GoCamping catalog' }}"
          branch: chore/gocamping-${{ github.event.inputs.mode || 'weekly' }}
          delete-branch: true
          title: "${{ github.event.inputs.mode == 'homepages' && '캠핑장 홈페이지 보강' || github.event.inputs.mode == 'photos' && '캠핑장 사진 보강' || '고캠핑 데이터 업데이트' }}"
          body: |
            공공데이터포털 고캠핑 공식 API만 사용합니다. 캠핏·네이버·캠프픽은 호출하지 않습니다.

            - 모드: `${{ github.event.inputs.mode || 'weekly' }}`
            - 우선 권역: `${{ github.event.inputs.region || '경기' }}`
            - 한도: `${{ github.event.inputs.limit || '40' }}`
            - Firestore(`camping-cf64d` / `camps`)에 이 워크플로에서 바로 반영했습니다.
            - JSON 시드(`public/data/`) PR은 저장소용입니다. 라이브는 https://camping-kr.web.app
          add-paths: |
            public/data/
