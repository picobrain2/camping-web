name: Weekly camp sync

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행에서 추가할 최대 개수"
        default: "40"
      region:
        description: "우선 권역 (경기, 강원, all …)"
        default: "경기"
      mode:
        description: "weekly(인기 후보), all(신규 한도까지), photos(제공 사진 채우기), homepages(홈페이지 보강)"
        default: "weekly"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check GoCamping key
        env:
          GOCAMPING_KEY: ${{ secrets.GOCAMPING_KEY }}
        run: |
          if [ -z "$GOCAMPING_KEY" ]; then
            echo "저장소 Secrets에 GOCAMPING_KEY를 넣어 주세요. 공공데이터포털 고캠핑 일반 인증키입니다."
            exit 1
          fi

      - run: npm ci

      - name: Sync from GoCamping
        env:
          GOCAMPING_KEY: ${{ secrets.GOCAMPING_KEY }}
          SYNC_LIMIT: ${{ github.event.inputs.limit || '40' }}
          SYNC_REGION: ${{ github.event.inputs.region || '경기' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'weekly' }}"
          if [ "$MODE" = "all" ]; then
            npm run sync:all
          elif [ "$MODE" = "photos" ]; then
            npm run sync:photos
          elif [ "$MODE" = "homepages" ]; then
            npm run enrich:homepages
          else
            npm run sync
          fi

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "${{ github.event.inputs.mode == 'photos' && 'data: backfill GoCamping photos' || github.event.inputs.mode == 'homepages' && 'data: enrich camp homepages' || 'data: update GoCamping catalog' }}"
          branch: chore/gocamping-${{ github.event.inputs.mode || 'weekly' }}
          delete-branch: true
          title: "${{ github.event.inputs.mode == 'homepages' && '캠핑장 홈페이지 보강' || github.event.inputs.mode == 'photos' && '캠핑장 사진 보강' || '고캠핑 데이터 업데이트' }}"
          body: |
            공공데이터포털 고캠핑 공식 API만 사용합니다. 캠핏·네이버·캠프픽은 호출하지 않습니다.

            - 모드: `${{ github.event.inputs.mode || 'weekly' }}`
            - 우선 권역: `${{ github.event.inputs.region || '경기' }}`
            - 한도: `${{ github.event.inputs.limit || '40' }}`

            머지하면 GitHub Pages가 다시 빌드됩니다.
          add-paths: |
            public/data/
